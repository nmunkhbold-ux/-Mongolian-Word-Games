<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монгол үгийн тоглоомууд</title>
<meta name="description" content="Таавар ба Үгийн сүлбээ — монгол хэл дээрх өдөр тутмын үгийн тоглоомууд.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=Unbounded:wght@800&family=Golos+Text:wght@400;600&display=swap">
<style>
:root{--bg:#f4f5f7;--fg:#16181d;--muted:#5f6572;--line:#d3d7de;--card:#fff;--sky:#1d64c8;--gold:#d9a21b;--g4:#bd96d9}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--fg:#ecedf0;--muted:#9aa0ad;--line:#2f333c;--card:#1b1e24;--sky:#3b82e6;--gold:#e0ab2a;--g4:#a982c6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Golos Text",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font-family:"PT Serif",Georgia,serif;font-size:clamp(1.8rem,7vw,2.6rem);margin:0 0 8px;border-bottom:3px double var(--fg);padding-bottom:12px}
p.lede{color:var(--muted);margin:0 0 28px;line-height:1.5}
.games{display:grid;gap:14px}
a.g{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:border-color .15s}
a.g:hover,a.g:focus-visible{border-color:var(--fg);outline:none}
.g h2{margin:0 0 6px;font-size:1.35rem}
.g p{margin:0;color:var(--muted);line-height:1.5}
.t h2{font-family:"Unbounded",sans-serif;letter-spacing:.04em}.t h2 span{color:var(--gold)}
.s h2{font-family:"PT Serif",Georgia,serif}
.chips{display:flex;gap:5px;margin-top:12px}.chips i{width:22px;height:22px;border-radius:4px;display:block}
</style>
</head>
<body>
<main>
<h1>Монгол үгийн тоглоомууд</h1>
<p class="lede">Өдөр бүр шинэ сорил. Найзуудтайгаа үр дүнгээ хуваалцаарай.</p>
<div class="games">
<a class="g t" href="taavar.html"><h2>ТААВА<span>Р</span></h2><p>5 үсэгтэй монгол үгийг 6 оролдлогоор таа.</p>
<div class="chips"><i style="background:var(--sky)"></i><i style="background:var(--gold)"></i><i style="background:var(--line)"></i><i style="background:var(--sky)"></i><i style="background:var(--sky)"></i></div></a>
<a class="g s" href="sulbee.html"><h2>Үгийн сүлбээ</h2><p>16 үгийг нийтлэг шинжээр нь 4 бүлэгт хуваа. Өдрийн болон хязгааргүй горимтой.</p>
<div class="chips"><i style="background:#efc94c"></i><i style="background:#a5c96a"></i><i style="background:#97b9ea"></i><i style="background:var(--g4)"></i></div></a>
</div>
</main>
</body>
</html>
