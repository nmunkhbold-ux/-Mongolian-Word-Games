<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Дөрвөн шагай шидэж өдрийн мэргээ үз, эсвэл шагайн морь уралдуул.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Шагай</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=Golos+Text:wght@400;600;700&display=swap">
<style>
/* Layout: one column — masthead, two tabs, a felt mat where four bones land, then the reading or the race track. */
:root{
  --bg:#f5f2f0; --fg:#1d1716; --muted:#6c5f5b; --line:#ddd3cf; --panel:#ffffff;
  --felt:#7a1f22; --felt-2:#5e1619; --bone:#efe4cf; --bone-sh:#c9b48f; --bone-ink:#6b4f2a;
  --accent:#c8902a; --p1:#1d64c8; --p2:#c8902a;
  --serif:"PT Serif",Georgia,serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141011; --fg:#efe8e4; --muted:#a8999a; --line:#352a2a; --panel:#1e1819;
  --felt:#6a1a1d; --felt-2:#4a1214; --bone:#e8dcc4; --bone-sh:#b9a37d; --bone-ink:#5e4524;
  --accent:#dba23a; --p1:#4a8ce8; --p2:#dba23a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141011; --fg:#efe8e4; --muted:#a8999a; --line:#352a2a; --panel:#1e1819;
  --felt:#6a1a1d; --felt-2:#4a1214; --bone:#e8dcc4; --bone-sh:#b9a37d; --bone-ink:#5e4524;
  --accent:#dba23a; --p1:#4a8ce8; --p2:#dba23a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.app{max-width:560px;margin:0 auto;padding:0 16px 28px;box-sizing:border-box}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:3px double var(--fg)}
h1{font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.2rem);margin:0;line-height:1}
.sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tabs{display:flex;justify-content:center;gap:6px;padding-block:14px 12px}
.tabs button{border:1px solid var(--line);background:none;color:var(--muted);font:600 .85rem var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mat{background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt-2));border-radius:14px;padding:22px 12px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:inset 0 2px 12px rgba(0,0,0,.35)}
.bone{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bone svg{width:100%;max-width:96px;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.bone b{color:#f6ead2;font-size:.9rem;letter-spacing:.02em}
.bone.tumble svg{animation:tumble .75s cubic-bezier(.3,.6,.4,1)}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-38px) rotate(var(--r,200deg))}70%{transform:translateY(4px) rotate(calc(var(--r,200deg)*1.6))}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.bone.tumble svg{animation:none}}
.btn{border:0;border-radius:999px;padding:13px 22px;font:700 1rem var(--body);cursor:pointer;background:var(--accent);color:#1d1716}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:none;border:1px solid var(--line);color:var(--fg);font-weight:600;font-size:.88rem;padding:10px 16px}
.btn:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.reading{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.reading .tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reading h2{font-family:var(--serif);font-size:1.45rem;margin:4px 0 8px;text-wrap:balance}
.reading p{margin:0;line-height:1.55;max-width:60ch}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tally span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;line-height:1.5}
.track{margin-top:18px;display:grid;gap:10px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lane .who{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem;margin-bottom:8px;font-variant-numeric:tabular-nums}
.lane.turn{border-color:var(--fg)}
.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.cells i{height:22px;border-radius:3px;background:var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.75rem;min-width:0}
.cells i.goal{background:var(--accent)}
.lane.p1 .cells i.on{background:var(--p1)} .lane.p2 .cells i.on{background:var(--p2)}
.cells i.here::after{content:"🐎";font-size:.85rem}
.rules{font-size:.86rem;color:var(--muted);line-height:1.5;margin-top:4px;text-align:center}
.log{text-align:center;font-weight:600;margin-top:12px;min-height:1.5em}
.opp{display:flex;justify-content:center;gap:6px;margin-top:4px}
.opp button{border:1px solid var(--line);background:none;color:var(--muted);font:600 .8rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.opp button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
</style>

<div class="app">
  <header>
    <div><h1>Шагай</h1><div class="sub" id="sub"></div></div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tFort" aria-selected="true">Өдрийн мэрэг</button>
    <button role="tab" id="tRace" aria-selected="false">Морь уралдаан</button>
  </div>

  <div class="mat" id="mat"></div>

  <section id="fort">
    <div class="row"><button class="btn" id="tossF">Шагай шидэх</button></div>
    <div class="reading" id="reading"></div>
  </section>

  <section id="race" hidden>
    <div class="opp"><button id="vsCpu" aria-pressed="true">Компьютертэй</button><button id="vs2" aria-pressed="false">Хоёулаа</button></div>
    <p class="rules">Морь буувал <b>2</b>, тэмээ буувал <b>1</b> алхана. Дөрвүүлаа ижил буувал дахин шиднэ. 15-р нүдэнд түрүүлж хүрсэн нь ялна!</p>
    <div class="track" id="track"></div>
    <div class="log" id="log"></div>
    <div class="row"><button class="btn" id="tossR">Шидэх</button><button class="btn alt" id="resetR">Шинээр эхлэх</button></div>
  </section>
</div>

<script>
// approximate real-world landing odds: the flat sides come up far more often
const S=[
  {k:"mori",n:"Морь",p:.12},{k:"temee",n:"Тэмээ",p:.12},{k:"khoni",n:"Хонь",p:.38},{k:"yamaa",n:"Ямаа",p:.38}
];
const $=id=>document.getElementById(id);
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pick(){let r=Math.random();for(const s of S){if((r-=s.p)<0)return s.k}return "yamaa"}
const NAME=Object.fromEntries(S.map(s=>[s.k,s.n]));

let UID=0;
// four faces of a sheep's anklebone: broad sides (хонь = domed back, ямаа = hollow) and narrow edges (морь = flat, тэмээ = humped)
function boneSVG(k){
  const u="b"+(UID++);
  const defs=`<defs>
   <linearGradient id="${u}f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf5e8"/><stop offset=".55" stop-color="#ead9b8"/><stop offset="1" stop-color="#c7aa78"/></linearGradient>
   <radialGradient id="${u}h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffdf6" stop-opacity=".95"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient>
   <radialGradient id="${u}d" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#6e4f26" stop-opacity=".75"/><stop offset=".6" stop-color="#9c7a48" stop-opacity=".35"/><stop offset="1" stop-color="#9c7a48" stop-opacity="0"/></radialGradient>
  </defs>`;
  const body=d=>`<ellipse cx="50" cy="93" rx="30" ry="4.5" fill="#000" opacity=".28"/><path d="${d}" fill="url(#${u}f)" stroke="#a88a58" stroke-width="1.2"/>`;
  const WIDE="M17 36C16 23 29 15 44 17c8 1 12-1 20-2 15-2 25 9 23 23-1 8 2 14 0 24-3 14-16 20-30 18-8-1-12 2-22 2-15 0-23-12-21-25 1-8 4-13 3-21z";
  let inner;
  if(k==="khoni") inner=body(WIDE)+`<ellipse cx="44" cy="44" rx="26" ry="18" fill="url(#${u}h)"/><path d="M24 66c16 6 38 6 58-4" fill="none" stroke="#b39466" stroke-width="1.6" stroke-linecap="round" opacity=".7"/><path d="M70 22c8 4 12 12 12 20" fill="none" stroke="#b39466" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>`;
  else if(k==="yamaa") inner=body(WIDE)+`<ellipse cx="51" cy="51" rx="27" ry="19" fill="url(#${u}d)"/><path d="M49 36c-4 9-3 20 3 30" fill="none" stroke="#f6ecd6" stroke-width="2.2" stroke-linecap="round" opacity=".75"/><path d="M28 34c12-8 32-9 46-2" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round" opacity=".8"/>`;
  else if(k==="mori") inner=body("M36 12c10-4 24-2 28 6 4 8 0 16 2 26s4 18 0 30c-4 12-20 16-28 10s-4-18-6-28-4-20-2-30c1-8 2-12 6-14z")+`<path d="M44 26c2 18 0 36 4 52" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" opacity=".55"/><ellipse cx="51" cy="20" rx="9" ry="5" fill="url(#${u}h)"/><path d="M58 30c2 14 0 30 2 44" fill="none" stroke="#a88a58" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><ellipse cx="50" cy="80" rx="8" ry="4" fill="url(#${u}d)" opacity=".7"/>`;
  else inner=body("M38 10c12-4 24 2 24 12 0 8 8 14 8 26s-8 16-6 28c2 10-12 16-22 10s-6-16-8-26-6-18-4-30c1-10 0-16 8-20z")+`<ellipse cx="58" cy="44" rx="10" ry="13" fill="url(#${u}h)"/><ellipse cx="44" cy="68" rx="8" ry="11" fill="url(#${u}d)"/><path d="M40 30c8 6 18 10 26 10" fill="none" stroke="#a88a58" stroke-width="1.4" stroke-linecap="round" opacity=".75"/><ellipse cx="46" cy="18" rx="6" ry="4" fill="url(#${u}h)"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${defs}${inner}</svg>`;
}
const mat=$("mat");
function paint(res,anim){
  mat.innerHTML=res.map(k=>`<div class="bone${anim?" tumble":""}" style="--r:${(Math.random()>.5?1:-1)*(160+Math.random()*200)}deg">${boneSVG(k)}<b>${NAME[k]}</b></div>`).join("");
}
const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function toss(cb){
  const res=[pick(),pick(),pick(),pick()];
  if(reduce()){paint(res,false);cb(res);return}
  let n=0;const spin=setInterval(()=>{paint([0,0,0,0].map(()=>S[Math.floor(Math.random()*4)].k),n===0);n++},110);
  setTimeout(()=>{clearInterval(spin);paint(res,false);cb(res)},700);
}
const count=res=>res.reduce((o,k)=>(o[k]=(o[k]||0)+1,o),{});

// ---------- fortune ----------
function read(res){
  const c=count(res),m=c.mori||0,t=c.temee||0,kinds=Object.keys(c).length;
  if(m===4)return["Дөрвөн морь","Ховорхон аз! Хийморь чинь сэргэж, санасан бүхэн тань бүтэх өдөр. Шинэ ажлаа эхлүүлэх, том шийдвэр гаргахад тохиромжтой."];
  if(t===4)return["Дөрвөн тэмээ","Тэвчээр, тэсвэр хатуужлын өдөр. Удаан ч гэсэн тогтвортой алхам чинь холын замыг туулна."];
  if(c.khoni===4)return["Дөрвөн хонь","Амар тайван, эв найрамдлын өдөр. Гэр бүл, ойр дотныхонтойгоо цагийг сайхан өнгөрүүлээрэй."];
  if(c.yamaa===4)return["Дөрвөн ямаа","Сэргэлэн, авхаалжтай байх өдөр. Санаачилга гаргавал бусдаас түрүүлнэ."];
  if(kinds===4)return["Дөрвөн өөр","Таван хошуу малын дөрвөн нь бүрдсэн шиг бүх зүйл цогцоороо. Олон талын ажил зэрэг бүтэмжтэй явна."];
  if(m===3)return["Гурван морь","Аз тань хөөрч байна. Зориг гаргаад урагшаа алхаарай, ойрын хүсэл биелэх дөхсөн."];
  if(t===3)return["Гурван тэмээ","Хол замын мэдээ, алсын хүсэл. Төлөвлөгөөгөө нарийн гаргавал үр дүнгээ өгнө."];
  if(m===2)return["Хоёр морь","Сайн нөхөр, сайхан уулзалт хүлээж байна. Хамтран хийх ажил бүтэмжтэй."];
  if(m===1&&t>=1)return["Морь, тэмээ","Хурд ба тэсвэр хоёр нийлжээ. Эхлүүлсэн ажлаа дуусгах хүч чамд бий."];
  if(m===1)return["Ганц морь","Жижиг ч гэсэн аз дагана. Өнөөдрийн нэг сайн үйл маргаашийн том баярын эх болно."];
  if(t>=1)return["Тэмээтэй","Тайван, хэмжээтэй байх нь зөв. Яаралгүй шийдвэр гаргаарай."];
  if((c.khoni||0)===3)return["Гурван хонь","Энгийн баяр баясгалан, тав тухтай өдөр. Бусдад туслах нь өөрт тань буянтай."];
  if((c.yamaa||0)===3)return["Гурван ямаа","Шинэ санаа, шинэ таниал. Сониуч зангаа дагаарай."];
  return["Хонь, ямаа","Жирийн тогтуун өдөр. Хүлээлтгүй ч болгоомжгүй бус, өдөр тутмын ажлаа сайн хийхэд тохиромжтой."];
}
function showReading(res,saved){
  const [h,p]=read(res),c=count(res);
  $("reading").innerHTML=`<div class="tag">${saved?"Өнөөдрийн мэрэг · "+todayKey():"Дахин шидсэн"}</div><h2>${h}</h2><p>${p}</p>
   <div class="tally">${S.map(s=>`<span>${s.n} ${c[s.k]||0}</span>`).join("")}</div>`;
}
$("tossF").onclick=()=>{
  const b=$("tossF");b.disabled=true;
  toss(res=>{
    const d=load("shagai-daily",null),first=!d||d.date!==todayKey();
    if(first)save("shagai-daily",{date:todayKey(),res});
    showReading(res,first);b.disabled=false;b.textContent="Дахин шидэх";
  });
};
function initFortune(){
  const d=load("shagai-daily",null);
  if(d&&d.date===todayKey()){paint(d.res,false);showReading(d.res,true);$("tossF").textContent="Дахин шидэх"}
  else{paint(["khoni","mori","yamaa","temee"],false);
    $("reading").innerHTML=`<div class="tag">Өнөөдрийн мэрэг</div><h2>Шагайгаа шидээрэй</h2><p>Өдрийн анхны шидэлт тань өнөөдрийн мэрэг болж хадгалагдана. Дараа нь хэдэн ч удаа шидэж болно.</p>`}
}

// ---------- race ----------
const GOAL=15;let race,vsCpu=true,busy=false;
function newRace(){race={pos:[0,0],turn:0,done:false};$("log").textContent="";renderTrack();updateBtn()}
function names(){return vsCpu?["Та","Компьютер"]:["1-р тоглогч","2-р тоглогч"]}
function renderTrack(){
  const nm=names();
  $("track").innerHTML=[0,1].map(i=>`<div class="lane p${i+1}${race.turn===i&&!race.done?" turn":""}"><div class="who"><span>${nm[i]}</span><span>${race.pos[i]} / ${GOAL}</span></div>
   <div class="cells">${Array.from({length:GOAL+1},(_,c)=>`<i class="${c===GOAL?"goal ":""}${c&&c<=race.pos[i]?"on ":""}${c===race.pos[i]?"here":""}">${c===GOAL&&race.pos[i]!==GOAL?"🏁":""}</i>`).join("")}</div></div>`).join("");
}
function updateBtn(){const b=$("tossR"),nm=names();b.disabled=busy||race.done||(vsCpu&&race.turn===1);b.textContent=race.done?"Тоглолт дууслаа":(vsCpu&&race.turn===1?"Компьютер шидэж байна…":nm[race.turn]+" шидэх")}
function raceToss(){
  if(busy||race.done)return;busy=true;updateBtn();
  toss(res=>{
    const c=count(res),step=(c.mori||0)*2+(c.temee||0),again=Object.keys(c).length===1,p=race.turn,nm=names();
    race.pos[p]=Math.min(GOAL,race.pos[p]+step);
    let msg=step?`${nm[p]}: +${step} алхам`:`${nm[p]}: морь, тэмээ буусангүй`;
    if(race.pos[p]>=GOAL){race.done=true;msg=vsCpu?(p===0?"🏆 Та түрүүллээ!":"Компьютер түрүүллээ. Дахин оролдоорой!"):`🏆 ${nm[p]} түрүүллээ!`}
    else if(again)msg+=" · Дөрвүүлаа ижил, дахин шиднэ!";
    else race.turn=1-p;
    $("log").textContent=msg;busy=false;renderTrack();updateBtn();
    if(vsCpu&&race.turn===1&&!race.done)setTimeout(raceToss,900);
  });
}
$("tossR").onclick=raceToss;$("resetR").onclick=newRace;
$("vsCpu").onclick=()=>{vsCpu=true;$("vsCpu").setAttribute("aria-pressed",true);$("vs2").setAttribute("aria-pressed",false);newRace()};
$("vs2").onclick=()=>{vsCpu=false;$("vs2").setAttribute("aria-pressed",true);$("vsCpu").setAttribute("aria-pressed",false);newRace()};

// ---------- tabs ----------
function tab(which){
  const f=which==="fort";$("tFort").setAttribute("aria-selected",f);$("tRace").setAttribute("aria-selected",!f);
  $("fort").hidden=!f;$("race").hidden=f;
  $("sub").textContent=f?"Өдрийн мэрэг · "+todayKey():"Шагайн морь уралдаан";
  if(f)initFortune();else paint(["mori","mori","temee","khoni"],false);
}
$("tFort").onclick=()=>tab("fort");$("tRace").onclick=()=>tab("race");
newRace();tab(location.hash==="#race"?"race":"fort");
</script>

<p style="text-align:center;font:13px system-ui;margin:8px 0 20px"><a href="index.html" style="color:inherit">← Бүх тоглоом</a></p>
</body>
</html>
